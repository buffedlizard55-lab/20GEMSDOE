name: external-verification
# Manual official-source refresh, not DrivenData polling. No automatic Git pushes:
# results are review artifacts and must not silently change frozen experiments.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-refresh
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial stack
        run: pip install -r requirements.txt geopandas pyogrio
      - name: Verify official data and extract local DEM context
        run: python scripts/ci_external_verify.py
      - name: Validate site and run source health (contest hosts skipped)
        run: |
          python scripts/build_site.py
          python scripts/check_site.py
          python scripts/source_health.py
      - name: Preserve verification reports even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-verification-reports
          path: |
            evidence/ci/*.json
            evidence/ci/*.csv
            docs/data/source_health.json
          if-no-files-found: error
